name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi==0.162.0 httpx==0.28.1 python-multipart==0.0.33 av==19.0.2 numpy==2.5.4 soundfile==0.14.0 scipy==1.18.1 tzdata==2026.6
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend scripts
        run: |
          node --check voz_estudio/static/app.js
          node --check voz_estudio/static/options.js
          node --check voz_estudio/static/design.js
          node --check voz_estudio/static/comparisons.js

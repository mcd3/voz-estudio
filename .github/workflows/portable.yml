name: Stop portable publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/portable.yml']
permissions:
  contents: read
concurrency:
  group: portable-release
  cancel-in-progress: true
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Portable distribution stays local; GitHub retains the standard installer.'

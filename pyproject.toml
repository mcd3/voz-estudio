[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voz-estudio"
version = "1.0.0"
description = "Estudio local de clonación de voz, síntesis e historial con JSON"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.33",
  "av==19.0.2", "numpy==2.5.4", "soundfile==0.14.0", "scipy==1.18.1",
  "faster-whisper==1.2.1", "tzdata==2026.6", "httpx==0.28.1",
  "transformers==5.15.1", "qwen-tts-hf==0.1.1.post1",
  "faster-qwen3-tts @ https://github.com/andimarafioti/faster-qwen3-tts/archive/b35fdc7d71eb3e4d19e63f4b4a330a1aef31d682.zip",
]

[project.scripts]
voz-estudio = "voz_estudio.__main__:main"

[tool.setuptools.packages.find]
include = ["voz_estudio*"]

[tool.setuptools.package-data]
voz_estudio = ["static/*"]
